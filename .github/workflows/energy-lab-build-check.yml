name: Energy Lab build check
on:
  push:
    branches: [energy-lab-0.3.1-build-check]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/*.mjs
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - run: docker build --platform "${{ matrix.platform }}" --tag energy-lab:build-check ./donaghcloney_energy_lab
      - run: |
          docker run --rm --entrypoint python3 energy-lab:build-check -c 'import ast; from pathlib import Path; [ast.parse(Path(path).read_text()) for path in ("/app/server.py", "/app/ha_sync.py")]; assert Path("/app/dist/index.html").is_file()'
